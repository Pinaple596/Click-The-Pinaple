<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click The Pineapple 🍍</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffcc00;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            padding-top: 40px;
            margin: 0;
        }
        h1 {
            font-size: 2.3rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px #ff3300;
        }
        p {
            color: #777;
            font-size: 1rem;
        }
        #score {
            font-size: 4rem;
            color: #ffffff;
            margin: 10px 0;
            font-weight: bold;
        }
        /* Styling emoji nanas */
        #pineapple {
            font-size: 140px;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: transform 0.05s ease;
            margin: 20px 0;
        }
        #pineapple:active {
            transform: scale(0.85) rotate(-5deg);
        }
        .stats-box {
            margin-top: 30px;
            background: #161616;
            display: inline-block;
            padding: 20px;
            border-radius: 12px;
            border: 2px dashed #ffcc00;
            text-align: center;
            width: 240px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stats-box h3 {
            margin-top: 0;
            color: #ffcc00;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .high-score {
            font-size: 1.5rem;
            color: #00ff66;
            font-weight: bold;
            margin-top: 10px;
        }
        .footer-text {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #444;
        }
    </style>
</head>
<body>

    <h1>🍍 CLICK THE PINEAPPLE 🍍</h1>
    <p>Tap the pineapple. Feed the void.</p>
    
    <div id="score">0</div>
    
    <!-- Emoji Nanas Utama -->
    <div id="pineapple" onclick="clickPineapple()">🍍</div>

    <div class="stats-box">
        <h3>🏆 Personal Best</h3>
        <div class="high-score" id="highscore">0</div>
    </div>

    <div class="footer-text">oh... um... eh... uiiaiuuiuai was here.</div>

    <script>
        let score = 0;
        let highScore = localStorage.getItem('pineappleHighScore') || 0;

        // Tampilkan High Score yang tersimpan saat web pertama dibuka
        document.getElementById("highscore").innerText = highScore;

        function clickPineapple() {
            score++;
            document.getElementById("score").innerText = score;

            // Cek apakah skor saat ini melebihi High Score
            if (score > highScore) {
                highScore = score;
                document.getElementById("highscore").innerText = highScore;
                // Simpan permanen di memori browser
                localStorage.setItem('pineappleHighScore', highScore);
            }
        }
    </script>

</body>
</html>
